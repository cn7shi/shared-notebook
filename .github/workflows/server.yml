name: Backend and API contract
on:
  push:
    paths: ['server/**', 'contracts/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'contracts/**', '.github/workflows/server.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
